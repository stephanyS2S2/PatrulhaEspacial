<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defensores da Terra - Salve o Planeta!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #050515; color: #fff; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #game-container {
            width: 100vw; height: 100vh; max-width: 800px; max-height: 600px;
            background: linear-gradient(to bottom, #020208 0%, #0d1b2a 70%, #1b263b 100%);
            position: relative; overflow: hidden; border: 2px solid #415a77; box-shadow: 0 0 20px rgba(0,255,255,0.2);
        }

        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.8; }

        #earth-surface {
            position: absolute; bottom: 0; width: 100%; height: 60px;
            background: linear-gradient(to top, #2ec4b6, #011627);
            border-top: 4px solid #2ec4b6; box-shadow: 0 -10px 20px rgba(46, 196, 182, 0.4);
            z-index: 2;
        }

        #hud {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; font-weight: bold; font-size: 18px; text-shadow: 2px 2px 4px #000;
        }

        .hud-item { background: rgba(0, 0, 0, 0.6); padding: 8px 15px; border-radius: 20px; border: 1px solid #415a77; }

        /* Desenho detalhado do meteoro com SVG */
        .meteor-wrapper {
            position: absolute; width: 80px; height: 80px;
            z-index: 5; display: flex; justify-content: center; align-items: center;
        }

        .meteor-svg {
            position: absolute; width: 100%; height: 100%;
            filter: drop-shadow(0 0 10px rgba(255, 100, 0, 0.8));
            animation: spinMeteor 12s linear infinite;
        }

        @keyframes spinMeteor {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .meteor-text {
            position: relative; z-index: 6; font-size: 26px; font-weight: 900;
            color: #ffffff; text-shadow: 2px 2px 4px #000, 0 0 8px #000;
            user-select: none;
        }

        .meteor-wrapper.frozen .meteor-svg {
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 1)) hue-rotate(120deg) !important;
        }

        /* Canhão de Defesa */
        #cannon {
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            width: 40px; height: 35px; background: linear-gradient(to top, #415a77, #e0e1dd);
            border-radius: 8px 8px 0 0; z-index: 4; border: 2px solid #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
        }

        /* Raio Laser Animação */
        .laser-beam {
            position: absolute; width: 6px; background: #00f0ff;
            box-shadow: 0 0 15px #00f0ff, 0 0 30px #ffffff;
            z-index: 4; transform-origin: bottom center;
            animation: pulseLaser 0.15s ease-out;
        }

        @keyframes pulseLaser {
            0% { opacity: 0.2; width: 2px; }
            50% { opacity: 1; width: 8px; }
            100% { opacity: 0; width: 1px; }
        }

        #controls-panel {
            position: absolute; bottom: 80px; width: 100%; display: flex;
            justify-content: center; gap: 15px; z-index: 10; padding: 0 20px;
        }

        .option-btn {
            background: linear-gradient(to bottom, #3a86ff, #03045e); color: white;
            border: 2px solid #00f0ff; padding: 12px 25px; font-size: 20px; font-weight: bold;
            border-radius: 10px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .option-btn:hover { transform: scale(1.05); background: linear-gradient(to bottom, #4ea8de, #0077b6); }
        .option-btn:active { transform: scale(0.95); }

        #ice-power-btn {
            background: linear-gradient(to bottom, #90e0ef, #00b4d8); color: #03045e;
            border: 2px solid #fff; padding: 8px 15px; border-radius: 20px; font-weight: bold;
            cursor: pointer; display: none; box-shadow: 0 0 10px #00b4d8;
        }
        #ice-power-btn.active { display: inline-block; animation: pulse 1s infinite alternate; }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 21, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 30px;
        }

        .overlay h1 { font-size: 36px; color: #00f0ff; margin-bottom: 15px; text-shadow: 0 0 10px #00f0ff; }
        .overlay p { font-size: 18px; margin-bottom: 20px; max-width: 600px; line-height: 1.4; color: #e0e1dd; }

        input[type="text"] {
            padding: 10px 15px; font-size: 18px; border-radius: 8px; border: 2px solid #00f0ff;
            outline: none; margin-bottom: 20px; text-align: center; background: #0d1b2a; color: #fff;
        }

        .main-btn {
            background: #ff0054; color: white; border: none; padding: 12px 30px;
            font-size: 20px; font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 0 15px #ff0054; transition: 0.2s;
        }
        .main-btn:hover { transform: scale(1.05); background: #ff5400; box-shadow: 0 0 20px #ff5400; }

        .character-box {
            display: flex; align-items: center; background: rgba(255,255,255,0.1);
            border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 1px solid #415a77;
        }
