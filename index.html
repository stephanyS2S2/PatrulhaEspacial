<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrulha Espacial</title>
    <!-- Estilos visuais do jogo (CSS) -->
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Container principal do jogo (Canvas de exibição) */
        #game-container {
            width: 800px;
            height: 600px;
            position: relative;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            border: 3px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            border-radius: 10px;
            overflow: hidden;
        }

        /* Efeito de estrelas de fundo */
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: blink 2s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }

        /* Telas de Interface (Menu, Diálogos, Fim de Jogo) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(5, 5, 16, 0.85);
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 42px;
            color: #00d2ff;
            text-shadow: 0 0 10px #00d2ff;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 28px;
            color: #ffcc00;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
            max-width: 600px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 25px;
            border: 2px solid #00d2ff;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            text-align: center;
            margin-bottom: 20px;
            width: 280px;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #00d2ff, #0066ff);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 5px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
        }

        /* Interface HUD (Vidas, Fase, Poderes) */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.3);
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #ice-power-btn {
            background: linear-gradient(45deg, #00ffff, #0088cc);
            padding: 6px 15px;
            font-size: 14px;
            border-radius: 15px;
            display: none;
        }

        /* Elementos de jogo: Meteoro, Laser, Terra */
        #earth {
            position: absolute;
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 1000px;
            height: 220px;
            background: radial-gradient(circle at 50% 0%, #2e8b57, #113f23 70%, #000 100%);
            border-radius: 50%;
            border-top: 4px solid #4deeea;
            box-shadow: 0 -10px 30px rgba(77, 238, 234, 0.3);
            z-index: 2;
        }

        .meteor {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff8c00, #ff4500, #8b0000);
            box-shadow: 0 0 20px #ff4500, inset 0 0 10px #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 4px #000;
            z-index: 3;
            top: -80px;
        }

        /* Tipos Especiais de Meteoro */
        .meteor.life {
            background: radial-gradient(circle at 30% 30%, #32cd32, #228b22, #006400);
            box-shadow: 0 0 20px #32cd32;
        }

        .meteor.ice {
            background: radial-gradient(circle at 30% 30%, #00ffff, #00bfff, #00008b);
            box-shadow: 0 0 20px #00ffff;
        }

        .meteor.frozen {
            box-shadow: 0 0 25px #00ffff, inset 0 0 15px #ffffff !important;
            filter: hue-rotate(180deg);
        }

        /* Raio Laser */
        .laser-beam {
            position: absolute;
            width: 6px;
            background: #00ffff;
            box-shadow: 0 0 15px #00ffff, 0 0 30px #ffffff;
            z-index: 4;
            transform-origin: bottom center;
        }

        /* Painel de Respostas */
        #answers-panel {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 6;
        }

        .answer-btn {
            min-width: 120px;
            padding: 12px 20px;
            font-size: 22px;
            background: rgba(10, 25, 50, 0.9);
            border: 2px solid #00d2ff;
            border-radius: 1
